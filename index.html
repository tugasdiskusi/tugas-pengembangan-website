<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusConnect - Portal Acara Kampus & Mahasiswa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- SIDEBAR NAVIGASI DESKTOP & MOBILE -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
          </div>
          <span id="sidebar-app-name">CampusConnect</span>
        </div>
        <button class="sidebar-close-btn" id="btn-close-sidebar" aria-label="Tutup Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Navigasi Dinamis Berdasarkan Role (Mahasiswa vs Admin) -->
      <nav class="sidebar-nav" id="sidebar-nav-container"></nav>

      <div class="sidebar-footer">
        <span class="app-badge" id="sidebar-app-version">v1.0.0</span>
        <span id="sidebar-role-indicator">Portal Mahasiswa</span>
      </div>
    </aside>

    <!-- MAIN APP AREA -->
    <div class="app-main">
      <!-- HEADER ATAS -->
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="btn-toggle-mobile-sidebar" aria-label="Buka Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="page-title-box">
            <h1 id="current-page-title">Katalog Acara Kampus</h1>
            <p id="current-page-desc">Jelajahi dan daftar kegiatan kampus yang tersedia</p>
          </div>
        </div>

        <div class="header-right">
          <!-- Tombol Switch Role (Mahasiswa / Admin) -->
          <button class="btn btn-secondary btn-sm" id="btn-toggle-role" style="display: flex; align-items: center; gap: 8px; font-weight: 600;">
            <span id="role-badge-text">🎓 Mode: Mahasiswa</span>
            <span style="font-size: 0.72rem; background: var(--color-primary-light); color: var(--color-primary); padding: 2px 6px; border-radius: var(--radius-sm);">Ganti</span>
          </button>

          <!-- Toggle Theme -->
          <button class="theme-toggle-btn" id="btn-theme-toggle" aria-label="Ganti Tema">
            <svg id="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <!-- User Profile & Auth Actions -->
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="user-profile-badge" id="header-user-badge" style="cursor: pointer;" title="Klik untuk ganti akun mahasiswa">
              <div class="user-avatar" id="header-user-avatar">MHS</div>
              <div class="user-meta">
                <span class="name" id="header-user-name">Raden M. Fauzan</span>
                <span class="role" id="header-user-role">Mahasiswa (2301010045)</span>
              </div>
            </div>

            <!-- Tombol Login / Logout -->
            <button class="btn btn-sm btn-secondary" id="btn-auth-action" style="padding: 7px 12px; font-size: 0.82rem; font-weight: 600;">
              Keluar
            </button>
          </div>
        </div>
      </header>

      <!-- PAGE CONTENT MOUNT POINT -->
      <main class="page-container" id="page-content"></main>
    </div>
  </div>

  <!-- MODAL AUTENTIKASI (LOGIN & DAFTAR AKUN MAHASISWA) -->
  <div id="modal-auth" class="modal-overlay">
    <div class="modal-card" style="max-width: 520px;">
      <div class="modal-header">
        <h2 class="modal-title" id="auth-modal-title">Masuk ke CampusConnect</h2>
        <button class="modal-close-btn" id="btn-close-auth-modal">&times;</button>
      </div>

      <!-- Auth Tabs: Login vs Register -->
      <div style="display: flex; border-bottom: 1px solid var(--color-border); background: var(--color-bg-app);">
        <button id="tab-auth-login" class="btn" style="flex: 1; border-radius: 0; border: none; border-bottom: 2px solid var(--color-primary); background: var(--color-bg-surface); font-weight: 700; color: var(--color-primary);">
          Masuk Mahasiswa
        </button>
        <button id="tab-auth-register" class="btn" style="flex: 1; border-radius: 0; border: none; background: transparent; font-weight: 600; color: var(--color-text-muted);">
          Daftar Akun Baru
        </button>
      </div>

      <div class="modal-body" style="padding: 24px;">
        <!-- TAB 1: FORM LOGIN MAHASISWA -->
        <div id="auth-view-login">
          <!-- Quick Login Demo Buttons -->
          <div style="margin-bottom: 18px; background: var(--color-bg-app); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 14px;">
            <div style="font-size: 0.78rem; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; margin-bottom: 8px;">
              Pilih Cepat Akun Demo Mahasiswa:
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px;" id="auth-demo-accounts-list">
              <!-- Diisi secara dinamis -->
            </div>
          </div>

          <form id="form-login-student">
            <div class="form-group">
              <label class="form-label">Nomor Induk Mahasiswa (NIM) <span class="required">*</span></label>
              <input type="text" id="login-input-nim" class="form-control" placeholder="Masukkan NIM terdaftar (contoh: 2301010045)" required />
              <div class="form-help">Masukkan NIM Anda untuk login ke portal kegiatan mahasiswa.</div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px; margin-top: 10px;">
              Masuk Sekarang
            </button>
          </form>

          <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--color-border); text-align: center;">
            <button class="btn btn-secondary btn-sm" id="btn-login-as-admin" style="width: 100%;">
              🛡️ Masuk sebagai Administrator Biro Kemahasiswaan
            </button>
          </div>
        </div>

        <!-- TAB 2: FORM DAFTAR MAHASISWA BARU -->
        <div id="auth-view-register" style="display: none;">
          <form id="form-register-new-student">
            <div class="form-group">
              <label class="form-label">Nama Lengkap Mahasiswa <span class="required">*</span></label>
              <input type="text" id="regnew-name" class="form-control" placeholder="Contoh: Muhammad Bintang Pratama" required />
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label">NIM <span class="required">*</span></label>
                <input type="text" id="regnew-nim" class="form-control" placeholder="Contoh: 2301050012" required />
              </div>

              <div class="form-group">
                <label class="form-label">Program Studi <span class="required">*</span></label>
                <select id="regnew-prodi" class="form-control" required>
                  <option value="Teknik Informatika">Teknik Informatika</option>
                  <option value="Sistem Informasi">Sistem Informasi</option>
                  <option value="Teknik Komputer">Teknik Komputer</option>
                  <option value="Sains Data">Sains Data</option>
                  <option value="Desain Komunikasi Visual">Desain Komunikasi Visual</option>
                  <option value="Manajemen Bisnis">Manajemen Bisnis</option>
                  <option value="Teknik Elektro">Teknik Elektro</option>
                  <option value="Ilmu Komunikasi">Ilmu Komunikasi</option>
                </select>
              </div>
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label">Email Kampus <span class="required">*</span></label>
                <input type="email" id="regnew-email" class="form-control" placeholder="bintang@student.campus.ac.id" required />
              </div>

              <div class="form-group">
                <label class="form-label">No. WhatsApp / HP <span class="required">*</span></label>
                <input type="tel" id="regnew-phone" class="form-control" placeholder="081234567890" required />
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px; margin-top: 10px;">
              Daftar &amp; Langsung Masuk
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Root -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Entry Point Script -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
