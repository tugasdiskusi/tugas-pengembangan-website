<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusConnect - Portal Acara Kampus & Mahasiswa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- SIDEBAR NAVIGASI DESKTOP & MOBILE -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
          </div>
          <span id="sidebar-app-name">CampusConnect</span>
        </div>
        <button class="sidebar-close-btn" id="btn-close-sidebar" aria-label="Tutup Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Navigasi Dinamis Berdasarkan Role (Mahasiswa vs Admin) -->
      <nav class="sidebar-nav" id="sidebar-nav-container"></nav>

      <div class="sidebar-footer">
        <span class="app-badge" id="sidebar-app-version">v1.0.0</span>
        <span id="sidebar-role-indicator">Portal Mahasiswa</span>
      </div>
    </aside>

    <!-- MAIN APP AREA -->
    <div class="app-main">
      <!-- HEADER ATAS -->
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="btn-toggle-mobile-sidebar" aria-label="Buka Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="page-title-box">
            <h1 id="current-page-title">Katalog Acara Kampus</h1>
            <p id="current-page-desc">Jelajahi dan daftar kegiatan kampus yang tersedia</p>
          </div>
        </div>

        <div class="header-right">
          <!-- Role Switcher Button -->
          <button class="btn btn-secondary btn-sm" id="btn-toggle-role" style="display: flex; align-items: center; gap: 8px; font-weight: 600;">
            <span id="role-badge-text">🎓 Mode: Mahasiswa</span>
            <span style="font-size: 0.72rem; background: var(--color-primary-light); color: var(--color-primary); padding: 2px 6px; border-radius: var(--radius-sm);">Ganti</span>
          </button>

          <!-- Toggle Theme -->
          <button class="theme-toggle-btn" id="btn-theme-toggle" aria-label="Ganti Tema">
            <svg id="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <!-- Profile Info Badge -->
          <div class="user-profile-badge" id="header-user-badge">
            <div class="user-avatar" id="header-user-avatar">MHS</div>
            <div class="user-meta">
              <span class="name" id="header-user-name">Raden M. Fauzan</span>
              <span class="role" id="header-user-role">Mahasiswa (2301010045)</span>
            </div>
          </div>
        </div>
      </header>

      <!-- PAGE CONTENT MOUNT POINT -->
      <main class="page-container" id="page-content"></main>
    </div>
  </div>

  <!-- Toast Notification Root -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Entry Point Script -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
